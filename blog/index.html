<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAHIL AHMED // LOGS</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600,500,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Clash Display"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        serif: ['"Playfair Display"', 'serif'],
                    },
                    colors: {
                        canvas: '#0A0A0A',
                        ink: '#EAEAEA',
                        grid: '#222222',
                        accent: '#FFFFFF',
                    },
                    letterSpacing: {
                        macro: '-0.05em',
                        micro: '0.05em'
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0A0A0A;
            color: #EAEAEA;
            cursor: crosshair;
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .text-micro {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        
        .text-macro {
            font-family: 'Clash Display', sans-serif;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            line-height: 0.85;
        }

        ::-webkit-scrollbar {
            width: 0;
            display: none;
        }
    </style>
</head>
<body class="antialiased overflow-x-hidden selection:bg-accent selection:text-ink">

    <div class="noise-overlay"></div>

    <!-- Global Nav Overlay -->
    <nav class="fixed top-0 w-full p-8 md:px-16 md:py-12 flex justify-end items-start z-[100] pointer-events-none">
        <div class="relative pointer-events-auto">
            <button id="terminal-toggle" class="text-ink/50 hover:text-ink transition-colors focus:outline-none flex items-center gap-2 group">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
                    <polyline points="4 17 10 11 4 5"></polyline>
                    <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
            </button>
            
            <div id="nav-terminal" class="absolute top-full right-0 mt-6 w-[350px] md:w-[500px] lg:w-[600px] bg-[#111111] border border-ink/10 flex flex-col font-mono text-micro text-ink p-6 hidden opacity-0 -translate-y-4 transition-all duration-[260ms] ease-out shadow-2xl">
                <div id="terminal-output" class="flex flex-col gap-1 mb-2 whitespace-pre-wrap leading-relaxed max-h-48 overflow-y-auto scrollbar-hide">
                    <div class="text-ink/50 mb-2">// SECURE SHELL INITIALIZED</div>
                    <div class="mb-4">System ready. Type <span class="text-accent">help</span> for commands.</div>
                </div>
                <div class="flex items-center gap-3 shrink-0 relative mt-4 pt-4 border-t border-ink/10">
                    <span class="text-accent shrink-0">root@sk:~#</span>
                    <div class="relative flex-1 flex items-center overflow-hidden">
                        <input type="text" id="terminal-input" class="absolute inset-0 w-full h-full bg-transparent border-none outline-none text-transparent caret-transparent focus:ring-0 p-0 shadow-none font-mono z-10" autocomplete="off" spellcheck="false">
                        <div class="pointer-events-none flex items-center whitespace-pre text-ink">
                            <span id="fake-input-text"></span>
                            <span class="inline-block w-2 h-4 bg-accent animate-[pulse_1s_ease-in-out_infinite]"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Go Back Link -->
    <a href="../index.html" class="fixed top-8 md:top-12 left-8 md:left-16 text-micro text-ink/50 hover:text-accent transition-colors z-50 mix-blend-difference uppercase flex items-center gap-2 group">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 transition-transform duration-300 group-hover:-translate-x-2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        ROOT
    </a>

    <main class="w-full pt-32 pb-16 px-8 md:px-16 min-h-[100dvh] flex flex-col items-center bg-gradient-to-b from-canvas to-neutral-900 relative">
        <div class="w-full max-w-[1200px] flex flex-col gap-16 relative z-10">
            <!-- Header -->
            <div class="flex flex-col gap-4 border-b border-ink/10 pb-8">
                <span class="text-micro text-ink/40">SYS.LOG_ARCHIVE //</span>
                <h1 class="text-macro text-6xl md:text-8xl">TRANSMISSIONS</h1>
                <p class="text-micro text-ink/60 max-w-md">SECURITY RESEARCH, TACTICAL EXPLOITS, AND SYSTEM ARCHITECTURE ANALYSIS.</p>
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap gap-4" id="blog-filters">
                <button class="filter-btn active text-micro text-accent transition-colors" data-tag="all">[ ALL ]</button>
            </div>

            <!-- Posts Grid -->
            <div class="flex flex-col gap-8 w-full border-t border-ink/10 pt-8" id="blog-posts-grid">
                <div class="text-micro animate-pulse">LOADING LOGS...</div>
            </div>
        </div>
    </main>

    <script src="../script.js"></script>
    <script src="blog.js"></script>
</body>
</html>
